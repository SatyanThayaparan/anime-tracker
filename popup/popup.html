<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <h1>Now Watching</h1>
      <p id="todaySummary" class="today-summary">Today · …</p>
    </header>

    <section class="section current-watching-section">
      <div id="currentWatching">
        <div class="loading">Loading...</div>
      </div>
    </section>

    <p id="debugStrip" class="debug-strip" aria-live="polite">site — · idle · hb none</p>

    <footer class="footer">
      <button class="dashboard-btn" id="openDashboard" type="button">
        View Full Dashboard
      </button>
    </footer>
  </div>

  <!-- Classic scripts only — no ES modules in the popup -->
  <script src="popup-boot.js"></script>
  <script src="popup.js"></script>
</body>
</html>
