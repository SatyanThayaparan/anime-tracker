<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Shiori">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe6f0"/>
      <stop offset="50%" stop-color="#eaf3f6"/>
      <stop offset="100%" stop-color="#d8e7cb"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8ee"/>
      <stop offset="100%" stop-color="#f0e0c8"/>
    </linearGradient>
    <linearGradient id="cord" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c04028"/>
      <stop offset="100%" stop-color="#8f2e1c"/>
    </linearGradient>
  </defs>

  <!-- soft circular badge -->
  <circle cx="64" cy="64" r="60" fill="url(#sky)"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#3f5f4e" stroke-opacity="0.14" stroke-width="2"/>

  <!-- distant hills -->
  <path d="M14 90 C32 74 48 78 64 84 C82 76 98 70 114 88 L114 112 L14 112 Z" fill="#6f8f78" opacity="0.5"/>
  <path d="M18 98 C38 86 52 90 68 96 C86 88 100 86 110 98 L110 112 L18 112 Z" fill="#3f5f4e" opacity="0.42"/>

  <!-- paper page behind bookmark -->
  <rect x="38" y="28" width="52" height="68" rx="4" fill="#f7f1e6" stroke="#a98467" stroke-width="2"/>
  <path d="M44 40 H84 M44 50 H78 M44 60 H82 M44 70 H72" stroke="#3f5f4e" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round"/>

  <!-- shiori ribbon bookmark -->
  <path d="M70 24 L86 24 L86 78 L78 70 L70 78 Z" fill="url(#ribbon)" stroke="#a98467" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M74 30 H82 M74 38 H82" stroke="#c04028" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round"/>

  <!-- rust tassel cord -->
  <path d="M78 24 C84 18 92 20 94 28 C90 34 84 36 78 32" fill="none" stroke="url(#cord)" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="94" cy="30" r="3.2" fill="#c04028"/>
</svg>
